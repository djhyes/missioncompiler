name: Bug report
description: Report a reproducible problem in the app, policy core, or prototype.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include secrets, private source code, credentials, or personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Native macOS app
        - Deterministic policy core
        - TaskSpec or schema
        - Project Skill
        - Web prototype
        - Documentation
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Sanitized environment
      placeholder: macOS version, Swift version, commit
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, credentials, private code, and personal data.
          required: true
